name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # macOS knitr and xfun binaries failed archive detection in CI.
          # Use pak's dependency override; keep the complete package checks.
          # https://pak.r-lib.org/reference/faq.html
          extra-packages: ${{ runner.os == 'macOS' && 'any::rcmdcheck, knitr=?source, xfun=?source' || 'any::rcmdcheck' }}
          needs: check
      - name: Check manual plot export guards
        run: Rscript scripts/test_plot_exports.R
      - name: Check source checkout socket workers
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript -e 'testthat::test_local(filter="parallel|core-225", stop_on_failure=TRUE)'
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
