name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.os }}${{ matrix.r != 'release' && format(', R {0}', matrix.r) || '' }}${{ matrix.deps == 'minimum' && ', minimum dependency versions' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The previous R release is checked on Windows only. Most users of an
      # older R work on Windows. The Windows job is also much shorter than the
      # Ubuntu job.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release]
        include:
          # The checks of the documentation (help pages, plot export guards
          # and the examples in \donttest blocks) run in this job only.
          - os: ubuntu-latest
            r: release
            docs: true
            extra: 'any::rcmdcheck, any::roxygen2'
          # macOS knitr and xfun binaries failed archive detection in CI.
          # Use pak's dependency override; keep the complete package checks.
          # https://pak.r-lib.org/reference/faq.html
          - os: macos-latest
            r: release
            extra: 'any::rcmdcheck, knitr=?source, xfun=?source'
          - os: windows-latest
            r: oldrel-1
          # R 4.1 is the oldest R that DESCRIPTION allows. Two jobs check it:
          # one with the current versions of the dependencies, and one with
          # R 4.1.0 and the oldest dependency versions that DESCRIPTION allows
          # (see the step "List the minimum versions in DESCRIPTION"). Both
          # build TMB from source, so that TMB is built against the Matrix
          # package that comes with R 4.1: a TMB binary built against another
          # Matrix ABI version makes every fit fail. Only the hard dependencies
          # are resolved, with the packages the tests need listed here: with
          # all dependencies, pak also resolves suggested packages of the
          # dependencies (Hmisc for ggplot2 4.0.0) and readxl, which need
          # R 4.2. The tests that use readxl are skipped.
          - os: ubuntu-latest
            r: '4.1'
            deptypes: '"hard"'
            extra: 'any::rcmdcheck, any::testthat, any::withr, any::pkgload, any::jsonlite, TMB=?source'
          - os: ubuntu-latest
            r: '4.1.0'
            deps: minimum
            deptypes: '"hard"'
            extra: 'any::rcmdcheck, any::testthat, any::withr, any::pkgload, any::jsonlite, TMB=?source'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      # For each package in Depends and Imports with a version requirement
      # (pkg (>= x.y)), pak installs exactly that version (reference pkg@x.y),
      # so the job checks the versions that DESCRIPTION states.
      - name: List the minimum versions in DESCRIPTION
        id: minimum
        if: matrix.deps == 'minimum'
        shell: Rscript {0}
        run: |
          fields <- read.dcf("DESCRIPTION", fields = c("Depends", "Imports"))
          entries <- trimws(unlist(strsplit(fields[!is.na(fields)], ",")))
          pattern <- "^([[:alnum:].]+)[[:space:]]*\\(>=[[:space:]]*([^)[:space:]]+)[[:space:]]*\\)$"
          refs <- sub(pattern, "\\1@\\2", grep(pattern, entries, value = TRUE))
          refs <- refs[!startsWith(refs, "R@")]
          cat("Minimum versions installed:", refs, sep = "\n")
          cat("refs=", paste(refs, collapse = " "), "\n", file = Sys.getenv("GITHUB_OUTPUT"),
              sep = "", append = TRUE)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ format('{0} {1}', matrix.extra || 'any::rcmdcheck', steps.minimum.outputs.refs) }}
          dependencies: ${{ matrix.deptypes || '"all"' }}
          needs: check
      - name: Check that the help pages match the roxygen comments
        if: matrix.docs
        shell: Rscript {0}
        run: |
          roxygen2::roxygenise()
          changed <- system2("git", c("status", "--porcelain", "--", "man", "NAMESPACE"), stdout = TRUE)
          if (length(changed))
            stop("The help pages differ from the roxygen comments in R/. Run roxygen2::roxygenise() and commit:\n",
                 paste(changed, collapse = "\n"))
      # Every R process otherwise compiles the TMB templates into its own
      # temporary folder. One folder shared by the steps below is named here;
      # ALSCL_TEST_CACHE is read by tests/testthat/helper-fixtures.R and
      # ALSCL_MANUAL_CACHE by the documentation scripts. Compiled templates are
      # stored under a key of the template sources, R, TMB, RcppEigen and the
      # automatic differentiation library, so a stale entry is never loaded.
      - name: Locate the shared TMB compile folder
        id: tmb-cache
        shell: Rscript {0}
        run: |
          folder <- gsub("\\", "/", file.path(Sys.getenv("RUNNER_TEMP"), "alscl-tmb"), fixed = TRUE)
          dir.create(folder, recursive = TRUE, showWarnings = FALSE)
          versions <- paste(R.version$major, R.version$minor, R.version$platform,
            packageVersion("TMB"), packageVersion("RcppEigen"), packageVersion("Matrix"), sep = "-")
          cat(sprintf("ALSCL_TEST_CACHE=%s\nALSCL_MANUAL_CACHE=%s\n", folder, folder),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          cat(sprintf("folder=%s\nversions=%s\n", folder, versions),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
      - name: Restore compiled TMB templates
        uses: actions/cache@v4
        with:
          path: ${{ steps.tmb-cache.outputs.folder }}
          key: alscl-tmb-${{ runner.os }}-${{ runner.arch }}-${{ steps.tmb-cache.outputs.versions }}-${{ hashFiles('inst/extdata/**') }}
      # The plot export guards and the documented plotting examples refit the
      # teaching models and one ALSCL retrospective. They test the documentation
      # scripts, not the platform or the R version, so one job is enough.
      - name: Check manual plot export guards
        if: matrix.docs
        run: Rscript scripts/test_plot_exports.R
      - name: Check source checkout socket workers
        shell: Rscript {0}
        run: |
          callr::rcmd("INSTALL", ".", show = TRUE, fail_on_status = TRUE)
          testthat::test_local(filter = "parallel|core-225", stop_on_failure = TRUE)
      - uses: r-lib/actions/check-r-package@v2
        with:
          # The examples that fit models are in \donttest blocks; run them in
          # one job so that documented calls are tested.
          args: ${{ matrix.docs && 'c("--no-manual", "--run-donttest")' || 'c("--no-manual")' }}
          error-on: '"warning"'
